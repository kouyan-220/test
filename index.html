<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font-size:14px}</style>
<title>事象の水平線</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the render fills the whole screen; a quiet title sits top-left and one
   instrument panel (readouts + sliders) docks right on wide screens, bottom sheet on phones. */
:root{
  color-scheme: dark;
  --void:#04060a;            /* page ground, matches the night sky */
  --ink:#e9e4da;             /* primary text, slightly warm like disk light */
  --ink-dim:#9aa3ad;         /* secondary text, sea-grey */
  --glass:rgba(8,13,20,.62); /* panel fill over the render */
  --line:rgba(233,228,218,.16);
  --ember:#ffb070;           /* accent: accretion-disk orange */
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#view:active{cursor:grabbing}
#view:focus-visible{box-shadow:inset 0 0 0 2px var(--ember)}


#toggle{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  font:500 12px/1 var(--f-body);letter-spacing:.12em;color:var(--ink);background:var(--glass);
  border:1px solid var(--line);border-radius:2px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#toggle:hover{border-color:var(--ember)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

#panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));
  width:min(300px,calc(100% - 32px));max-height:calc(100% - 90px - env(safe-area-inset-bottom,0px));overflow-y:auto;
  background:var(--glass);border:1px solid var(--line);border-radius:2px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px;display:flex;flex-direction:column;gap:16px}
#panel h2{margin:0;font:500 11px/1 var(--f-body);letter-spacing:.2em;color:var(--ink-dim)}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:12px}
dt{color:var(--ink-dim)}
dd{margin:0;font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ctl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;font-size:12px}
.ctl output{font-family:var(--f-data);font-variant-numeric:tabular-nums;color:var(--ember)}
.ctl input{grid-column:1/-1;width:100%;margin:0;accent-color:var(--ember)}
.sliders{display:flex;flex-direction:column;gap:12px}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
#mute[aria-pressed="true"],#calm[aria-pressed="true"],#life[aria-pressed="true"],#music[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 12px/1 var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:8px 10px;cursor:pointer}
.chips button:hover{border-color:var(--ember)}
.bare #panel,.bare #hint{display:none!important}
.bare #toggle{opacity:.16}
.bare #toggle:hover,.bare #toggle:focus-visible{opacity:1}
#shot-view{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(2,4,8,.9);padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#shot-view figure{margin:0;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:100%}
#shot-view img{max-width:100%;max-height:70vh;border:1px solid var(--line)}
#shot-view figcaption{font-size:12px;color:var(--ink-dim)}
#shot-view .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#shot-view a,#shot-view button{font:500 12px/1 var(--f-body);letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px 16px;cursor:pointer;text-decoration:none}
#shot-view a:hover,#shot-view button:hover{border-color:var(--ember)}
#throw,#calm,#mute,#shot,#bare,#life,#music{font:500 12px/1 var(--f-body);letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px;cursor:pointer}
#throw:hover,#calm:hover,#mute:hover,#shot:hover,#bare:hover,#life:hover,#music:hover{border-color:var(--ember)}
#pause{font:500 12px/1 var(--f-body);letter-spacing:.1em;color:var(--void);background:var(--ember);border:0;border-radius:2px;padding:10px;cursor:pointer}
#pause[aria-pressed="true"]{background:transparent;color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}

#hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:12px;letter-spacing:.14em;color:var(--ink-dim);pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 10px #000}
#hint.gone{opacity:0}
#loading{text-shadow:0 1px 10px #000,0 0 4px #000;position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-size:13px;letter-spacing:.14em;color:var(--ink-dim);pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;line-height:1.8;background:var(--void)}
#fail pre{white-space:pre-wrap;font:12px var(--f-data);color:var(--ink-dim);text-align:left;max-width:80ch}

@media (max-width:640px){
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;max-height:58%}}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

</head>
<body>
<canvas id="view" tabindex="0" aria-label="ブラックホールが昇る夜の海の3Dレンダリング。ドラッグまたは矢印キーで見回せます。"></canvas>


<button id="toggle" type="button" aria-expanded="true" aria-controls="panel">計器</button>

<aside id="panel">
  <h2>観測値</h2>
  <dl>
    <dt>質量</dt><dd>4.3×10⁶ M☉</dd>
    <dt>シュワルツシルト半径</dt><dd>1,270万 km</dd>
    <dt>観測距離</dt><dd id="r-au">—</dd>
    <dt>影の視直径</dt><dd id="r-shadow">—</dd>
    <dt>円盤内縁の軌道速度</dt><dd>0.50 c</dd>
    <dt>ここでの1秒</dt><dd id="r-dil">—</dd>
  </dl>
  <hr>
  <h2>調整</h2>
  <div class="sliders">
    <label class="ctl" for="s-dist"><span>ブラックホールまでの距離</span><output id="o-dist"></output>
      <input id="s-dist" type="range" min="18" max="90" step="1" value="45"></label>
    <label class="ctl" for="s-tilt"><span>降着円盤の傾き</span><output id="o-tilt"></output>
      <input id="s-tilt" type="range" min="2" max="40" step="1" value="8"></label>
    <label class="ctl" for="s-wave"><span>うねりの高さ</span><output id="o-wave"></output>
      <input id="s-wave" type="range" min="0" max="2.4" step="0.1" value="0.8"></label>
    <label class="ctl" for="s-clear"><span>水の透明度</span><output id="o-clear"></output>
      <input id="s-clear" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    <label class="ctl" for="s-time"><span>時間の流れ</span><output id="o-time"></output>
      <input id="s-time" type="range" min="0" max="4" step="0.1" value="1"></label>
    <label class="ctl" for="s-exp"><span>露出</span><output id="o-exp"></output>
      <input id="s-exp" type="range" min="-2" max="2" step="0.1" value="0"></label>
  </div>
  <hr>
  <h2>舞台</h2>
  <div class="chips" id="c-stage" role="group" aria-label="舞台">
    <button type="button" data-v="0">海</button><button type="button" data-v="1">塩湖</button><button type="button" data-v="2">氷原</button><button type="button" data-v="3">砂漠</button><button type="button" data-v="4">雲海</button><button type="button" data-v="5">溶岩</button><button type="button" data-v="6">草原</button><button type="button" data-v="7">山頂</button><button type="button" data-v="8">宇宙</button>
  </div>
  <h2>空</h2>
  <div class="chips" id="c-sky" role="group" aria-label="空">
    <button type="button" data-v="0">夜</button><button type="button" data-v="1">夕焼け</button><button type="button" data-v="2">オーロラ</button><button type="button" data-v="3">嵐</button><button type="button" data-v="4">霧</button><button type="button" data-v="5">夢色</button><button type="button" data-v="6">朝焼け</button><button type="button" data-v="7">青空</button><button type="button" data-v="8">満天の星</button><button type="button" data-v="9">紅</button>
  </div>
  <hr>
  <button id="shot" type="button">撮影する</button>
  <button id="bare" type="button">画面の表示を隠す（H キー）</button>
  <button id="life" type="button" aria-pressed="false">生き物を消す</button>
  <button id="music" type="button" aria-pressed="false">音楽を止める</button>
  <button id="mute" type="button" aria-pressed="false">音を消す</button>
  <button id="calm" type="button" aria-pressed="false">うねりを止める</button>
  <button id="throw" type="button">ブラックホールへ投げ入れる</button>
  <button id="pause" type="button" aria-pressed="false">一時停止</button>
</aside>

<div id="loading">景色を準備しています…</div>
<div id="hint">クリック / タップで惑星を投げ入れる ・ ドラッグで見回す ・ ホイール / ピンチでズーム ・ 操作すると音が出ます</div>
<div id="shot-view" hidden>
  <figure>
    <img id="shot-img" alt="撮影した画像">
    <figcaption>画像を右クリック（スマホは長押し）して保存できます</figcaption>
    <div class="row"><a id="shot-save" download="event-horizon.png">ファイルに保存</a><button id="shot-close" type="button">閉じる</button></div>
  </figure>
</div>
<div id="fail" hidden></div>

<script id="fs-scene" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform int uZ;                             // always 0: keeps the compiler from unrolling loops
uniform float uTime,uDiskT,uDist,uDepth,uTanFov,uLDR,uAbs;
uniform float uStage,uBed,uHS,uStar,uCloud,uFog,uAur,uFlash,uLife,uToon,uBoost;   // stage: 0 sea, 1 salt flat, 2 ice, 3 dunes, 4 cloud sea, 5 lava, 6 grassland, 7 summit over a city, 8 open space
uniform vec3 uSkyH,uSkyZ,uAmb;                              // sky colour at the horizon and overhead, ambient light
uniform vec3 uRo,uFw,uRt,uUp,uNd,uE1,uE2;

uniform vec3 uBH;                          // direction of the black hole in the sky
#define B uBH
const vec3 DISKC=vec3(1.,.5,.2);           // mean colour of the light it casts
const float RIN=3.,ROUT=12.;               // disk radii in Schwarzschild radii (ISCO = 3 r_s)

float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float noise(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){float a=.5,s=0.;for(int i=uZ;i<5;i++){s+=a*noise(p);p=p*2.03+7.1;a*=.5;}return s;}

vec3 voro(vec2 x){                                          // x: distance to the nearest cell border, y: a number per cell, z: distance to the cell centre
  vec2 n=floor(x),f=fract(x),mg=vec2(0.),mr=vec2(0.);float md=8.,id=0.;
  for(int j=uZ-1;j<=1;j++)for(int i=uZ-1;i<=1;i++){
    vec2 g=vec2(float(i),float(j)),o=hash33(vec3(n+g,7.)).xy,r=g+o-f;
    float d=dot(r,r);
    if(d<md){md=d;mr=r;mg=g;id=o.x;}
  }
  float d1=sqrt(md);
  md=8.;
  for(int j=uZ-2;j<=2;j++)for(int i=uZ-2;i<=2;i++){
    vec2 g=mg+vec2(float(i),float(j)),o=hash33(vec3(n+g,7.)).xy,r=g+o-f;
    if(dot(mr-r,mr-r)>1e-5)md=min(md,dot(.5*(mr+r),normalize(r-mr)));
  }
  return vec3(md,id,d1);
}

/* ---------- far sky: stars and a galactic band ---------- */
vec3 starLayer(vec3 d,float s,float dens){
  vec3 p=d*s,ip=floor(p),fp=fract(p),h=hash33(ip);
  float dd=length(fp-(.2+.6*h));
  float on=step(1.-dens,hash13(ip+7.3));
  float b=pow(hash13(ip+3.1),7.)*46.+.35;
  float core=smoothstep(.13,0.,dd);core*=core;
  return mix(vec3(1.,.72,.5),vec3(.62,.78,1.),h.y)*core*b*on;
}
vec3 farSky(vec3 d){
  vec3 M=normalize(vec3(.78,-.55,-.13));
  float m=dot(d,M),band=exp(-m*m*14.);
  float n=fbm(d*3.5+2.),n2=fbm(d*9.+n*2.);
  float dust=smoothstep(.38,.72,fbm(d*6.+vec3(4.,1.,7.)+n))*exp(-m*m*55.);
  vec3 mw=mix(vec3(.22,.3,.55),vec3(.95,.74,.52),band*n2)*band*(.2+1.1*n*n2);
  vec3 c=mw*.3*(1.-.85*dust);
  float dens=.22+.65*band;
  c+=starLayer(d,170.,dens)*(1.-.8*dust);
  c+=starLayer(d.zxy,85.,.1)*2.6;
  c+=starLayer(d.yzx,310.,dens)*.55*(1.-.8*dust);
  return c;
}

/* ---------- accretion disk ---------- */
vec3 blackbody(float T){
  vec3 l=vec3(610.,550.,465.);
  vec3 c=1./(pow(l/550.,vec3(5.))*(exp(1.4388e7/(l*T))-1.));
  return c/(max(c.r,max(c.g,c.b))+1e-12);
}
float streaks(float a,float r,float z){
  float c=cos(a),s=sin(a);
  return .6*fbm(vec3(c*2.4,s*2.4,r*2.1+z))+.4*fbm(vec3(c*7.,s*7.,r*6.5-z));
}
void disk(vec3 hit,vec3 vel,inout vec3 col,inout float tr){
  float r=length(hit);
  if(r<RIN||r>ROUT)return;
  float x=r/RIN;
  float prof=pow(x,-3.)*(1.-sqrt(1./x))*17.6;           // thin-disk flux, peaks just outside the inner edge
  float phi=atan(dot(hit,uE2),dot(hit,uE1));
  float om=.7071/(r*sqrt(r));                            // Keplerian angular velocity
  const float P=40.;
  float p1=fract(uDiskT/P),p2=fract(uDiskT/P+.5);
  float w1=1.-abs(2.*p1-1.);
  float n=streaks(phi-om*(p1-.5)*P,r,uDiskT*.015)*w1+streaks(phi-om*(p2-.5)*P+2.,r,uDiskT*.015+5.)*(1.-w1);
  float dens=smoothstep(.28,.72,n);
  float v=sqrt(.5/(r-1.));                               // orbital speed seen by a static observer
  vec3 tang=normalize(cross(uNd,hit));
  float dop=sqrt(1.-v*v)/(1.-v*dot(tang,-normalize(vel)));
  float g=dop*sqrt(1.-1./r);                             // Doppler x gravitational redshift
  float T=max(4500.*pow(max(prof,1e-4),.25)*g,900.);
  vec3 e=blackbody(T)*prof*pow(g,3.5)*(.22+1.7*dens*dens)*3.4;
  float al=clamp((.3+.7*dens)*smoothstep(ROUT,ROUT-3.5,r)*smoothstep(RIN,RIN+.35,r)*mix(1.5,.45,smoothstep(5.,12.,r)),0.,1.);
  col+=tr*e*al;tr*=1.-al;
}

/* ---------- thrown planets: real spheres, stretched by tides as they fall ---------- */
uniform int uN;
uniform vec4 uP[8];   // xyz centre (hole frame), w radius
uniform vec4 uQ[8];   // xyz tidal axis (radial), w stretch factor
uniform vec4 uA[8];   // xyz spin axis, w type: 0 earth, 1 saturn, 2 jupiter, 3 mars, 4 sun, 5 moon
uniform vec4 uK[8];   // x brightness near the horizon, y reddening, z spin angle, w seed

float ringAlpha(float rr){
  float a=smoothstep(1.25,1.32,rr)*smoothstep(2.35,2.28,rr);
  a*=.6+.4*sin(rr*38.);
  a*=1.-.9*smoothstep(.035,0.,abs(rr-1.95));
  return a*.9;
}
vec3 surface(vec3 s,vec3 k,float type,float ang,float seed){
  float lat=dot(s,k),ca=cos(ang),sa=sin(ang);
  vec3 q=s*ca+cross(k,s)*sa+k*lat*(1.-ca)+seed;
  if(type<.5){
    float land=fbm(q*1.9);
    vec3 sea=mix(vec3(.01,.045,.19),vec3(.02,.15,.34),smoothstep(.3,.5,land));
    vec3 gnd=mix(vec3(.07,.2,.05),vec3(.46,.37,.2),smoothstep(.54,.68,land));
    vec3 c=mix(sea,gnd,smoothstep(.5,.525,land));
    c=mix(c,vec3(.88,.92,.95),smoothstep(.78,.88,abs(lat)+.15*land));
    float cl=smoothstep(.5,.72,fbm(q*4.3+vec3(0.,uTime*.02,3.)));
    return mix(c,vec3(.95),cl*.85);
  }
  if(type<1.5){
    float b=sin(lat*17.+2.5*fbm(q*3.));
    return mix(vec3(.84,.72,.5),vec3(.63,.5,.33),.5+.5*b);
  }
  if(type<2.5){
    float w=fbm(q*2.5+vec3(0.,lat*6.,0.));
    vec3 c=mix(vec3(.86,.8,.7),vec3(.6,.35,.2),.5+.5*sin(lat*23.+5.*w));
    return mix(c,vec3(.75,.3,.15),smoothstep(.66,.76,w)*.6);
  }
  if(type<3.5){
    vec3 c=mix(vec3(.5,.2,.1),vec3(.85,.52,.3),fbm(q*3.2))*(.75+.5*fbm(q*9.));
    return mix(c,vec3(.92),smoothstep(.86,.93,abs(lat)));
  }
  if(type<4.5){                                            // sun: granulation and dark spots
    float gr=fbm(q*9.+vec3(0.,0.,uTime*.05));
    vec3 c=mix(vec3(1.,.36,.05),vec3(1.,.86,.5),smoothstep(.25,.7,gr));
    return c*(1.-.8*smoothstep(.66,.74,fbm(q*2.2)));
  }
  float mare=smoothstep(.44,.58,fbm(q*1.4));                // moon: maria and cratered highlands
  float cr=fbm(q*7.);
  return vec3(.58,.57,.55)*mix(1.,.38,mare)*(.7+.6*cr)*(1.-.35*smoothstep(.62,.66,cr));
}
/* segment ro..ro+rd against planet j; returns premultiplied colour, coverage and where along the segment */
bool hitObj(int j,vec3 ro,vec3 rd,out float tHit,out vec3 c,out float a){
  vec3 ctr=uP[j].xyz,ax=uQ[j].xyz,k=uA[j].xyz;
  float R=uP[j].w,st=uQ[j].w,type=uA[j].w,ip=1./st,sp=sqrt(st);
  vec3 o=ro-ctr;vec3 ol=ax*dot(o,ax);o=ol*ip+(o-ol)*sp;       // undo the tidal stretch
  vec3 dl=ax*dot(rd,ax);vec3 d=dl*ip+(rd-dl)*sp;
  float A=dot(d,d),Bq=dot(o,d),C=dot(o,o)-R*R,disc=Bq*Bq-A*C;
  float ts=2.;
  if(disc>0.){ts=(-Bq-sqrt(disc))/A;if(ts<0.||ts>1.)ts=2.;}
  float tg=2.,ra=0.;
  if(type>.5&&type<1.5){
    float dn=dot(d,k);
    if(abs(dn)>1e-6){
      float t=-dot(o,k)/dn;
      if(t>0.&&t<=1.){
        float rr=length(o+d*t)/R;
        if(rr>1.25&&rr<2.35){ra=ringAlpha(rr);tg=t;}
      }
    }
  }
  if(ts>1.&&ra<=0.)return false;
  vec3 Ld=-normalize(ctr),V=-normalize(rd);
  vec3 lightC=vec3(1.,.85,.7)*2.4;
  vec3 sc=vec3(0.);
  if(ts<=1.){
    vec3 nl=(o+d*ts)/R;
    vec3 np=ax*dot(nl,ax);
    vec3 n=normalize(np*ip+(nl-np)*sp);
    float ndl=max(dot(n,Ld),0.),ndv=max(dot(n,V),0.);
    vec3 al=surface(nl,k,type,uK[j].z,uK[j].w);
    if(type>3.5&&type<4.5)sc=al*(.3+.7*sqrt(ndv))*9.;       // the sun shines by itself, with limb darkening
    else sc=al*(lightC*ndl+vec3(.5,.55,.65)*.45*(.5+.5*ndv));
    if(type<.5)sc+=vec3(.25,.5,1.)*pow(1.-ndv,3.)*(.2+ndl);
  }
  vec3 rc=vec3(.82,.72,.56)*(lightC*.45+.25)*ra;
  if(tg<ts){c=rc;a=ra;tHit=tg;if(ts<=1.){c+=(1.-ra)*sc;a=1.;}}
  else{c=sc;a=1.;tHit=ts;}
  float g=dot(c,vec3(.3,.6,.1));
  c=mix(c,g*vec3(1.6,.35,.06),uK[j].y)*uK[j].x;             // redshift and fade at the horizon
  return true;
}

float gTr;vec3 gEm;                         // last traced ray: what is left for the background, and the light added in front of it
/* ---------- light bending: integrate the photon path around the hole ---------- */
vec3 space(vec3 d){
  vec3 pos=-B*uDist,vel=d;
  bool near=false;
  for(int j=uZ;j<8;j++){
    if(j>=uN)break;
    vec3 a=uP[j].xyz-pos;
    vec3 w=a-d*max(dot(a,d),0.);
    float bd=uP[j].w*2.4*uQ[j].w+2.;
    if(dot(w,w)<bd*bd)near=true;
  }
  vec3 hv=cross(pos,vel);float h2=dot(hv,hv),b=sqrt(h2);
  float mu=dot(d,B);
  vec3 tb=B-d*mu;
  vec3 dW=normalize(d+tb/max(length(tb),1e-4)*min((1.+mu)/max(b,1e-3),.6));   // weak-field deflection
  float bmax=min(20.,uDist*.9);
  float rb=near?uDist*4.:uDist*1.1;
  vec3 col=vec3(0.);float tr=1.;vec3 dO=dW;
  if((b<bmax&&mu>0.)||near){
    for(int i=uZ;i<160;i++){
      float r2=dot(pos,pos),r=sqrt(r2);
      if(r<1.){tr=0.;break;}
      if(r>rb&&dot(pos,vel)>0.)break;
      float dt=max(.03,.07*r);
      vel+=-1.5*h2*pos/(r2*r2*r)*dt;
      vec3 np=pos+vel*dt,sg=np-pos;
      float tO=2.,oa=0.;vec3 oc=vec3(0.);
      if(near){
        vec3 mid=pos+.5*sg;float hl=.5*length(sg);
        for(int j=uZ;j<8;j++){
          if(j>=uN)break;
          vec3 cc=uP[j].xyz-mid;
          float bd=hl+uP[j].w*2.4*uQ[j].w;
          if(dot(cc,cc)<bd*bd){
            float t,a;vec3 c;
            if(hitObj(j,pos,sg,t,c,a)&&t<tO){tO=t;oc=c;oa=a;}
          }
        }
      }
      float s0=dot(pos,uNd),s1=dot(np,uNd);
      bool dk=s0*s1<0.&&tr>.01;
      float f=dk?s0/(s0-s1):2.;
      if(dk&&f<tO)disk(mix(pos,np,f),vel,col,tr);
      if(tO<=1.){col+=tr*oc;tr*=1.-oa;}
      if(dk&&f>=tO&&tr>.01)disk(mix(pos,np,f),vel,col,tr);
      if(tr<.004)break;
      pos=np;
    }
    dO=normalize(mix(normalize(vel),dW,smoothstep(13.,bmax,b)));
  }
  gTr=tr;gEm=col;
  return col+tr*farSky(dO);
}

vec3 atmo(vec3 d){
  float y=max(d.y,0.),hz=exp(-y*7.);
  float mu=max(dot(d,B),0.);
  vec3 a=vec3(.010,.018,.032)*hz*.7+DISKC*(pow(mu,26.)*.05+pow(mu,5.)*.012)*(.35+hz);
  if(uToon>.5){                                             // colours measured from the reference picture
    vec3 sun=normalize(vec3(.62,.2,-.76));
    float sd_=max(dot(d,sun),0.);
    float right=.5+.5*dot(normalize(d.xz+1e-4),normalize(sun.xz));
    vec3 c=mix(vec3(.6,.28,.29),vec3(1.5,.27,.2),smoothstep(.05,.22,y));                       // pink-mauve band, then peach
    c=mix(c,mix(vec3(1.26,.94,.28),vec3(.264,.113,.126),smoothstep(.3,.7,right)),smoothstep(.3,.65,y));   // pale yellow / dusty rose overhead
    c+=vec3(3.,2.6,2.3)*exp(-y*24.);                        // white-hot horizon
    c+=vec3(3.,1.2,.35)*pow(sd_,16.)*.9;                     // pale yellow glow of the low sun
    return c;
  }
  a+=mix(uSkyZ,uSkyH,pow(1.-y,5.));                         // time of day
  vec3 fg=uSkyH*.6+vec3(.05,.058,.07)+DISKC*.1*pow(mu,3.);
  return mix(a,fg,uFog*exp(-y*2.5)*.9);                     // fog bank
}
vec3 aurora(vec3 d){
  if(d.y<.02)return vec3(0.);
  vec2 q=d.xz/(d.y+.3);
  float tt=uDiskT*.012;
  float w=fbm(vec3(q*.6,tt));
  float band=.5+.5*sin(q.x*2.6+q.y*1.1+w*9.+tt*2.);
  float cur=pow(smoothstep(.78,1.,band),1.3)*(.2+.8*noise(vec3(q.x*14.,q.y*1.2,tt*3.)));   // curtains with vertical rays
  float fade=smoothstep(.02,.22,d.y)*smoothstep(1.,.55,d.y);
  return (vec3(.08,1.,.42)*cur+vec3(.55,.12,.9)*cur*cur*smoothstep(.3,.8,d.y)*1.5)*fade*.7;
}
vec4 clouds(vec3 d){                                        // rgb colour, a coverage
  if(d.y<.005)return vec4(0.);
  vec2 q=d.xz/(d.y+.1);
  float tt=uDiskT*.003;
  float n=fbm(vec3(q*.35+vec2(tt,0.),tt*.5));
  float cov=smoothstep(.66-uCloud*.36,.82-uCloud*.3,n)*smoothstep(.005,.07,d.y);
  float mu=max(dot(d,B),0.);
  cov*=smoothstep(.02,.2,1.-mu);                            // the hole keeps a clearing around itself
  vec3 c=vec3(.012,.015,.022)+uSkyH*(.5+.8*exp(-d.y*5.))+DISKC*.3*pow(mu,3.)*(1.-n)+uFlash*vec3(.8,.9,1.2)*n*n*3.;
  if(uToon>.5){                                             // painted look
    vec3 A=normalize(vec3(.85,-.3,.35));                    // the wind: masses are drawn out along it
    vec3 p3=d-A*dot(d,A)*.68;
    float big=fbm(p3*3.+vec3(tt*.6,0.,3.));
    float up=fbm((p3+vec3(0.,.035,0.))*3.+vec3(tt*.6,0.,3.));
    vec2 w=vec2(d.x+d.z*.5,d.y*1.4+d.z*.35);
    vec3 vc=voro(w*9.+1.5*vec2(noise(vec3(w*5.,2.)),noise(vec3(w*5.,7.))));
    float v=big+(.5-vc.z)*.09+(noise((d-A*dot(d,A)*.97)*45.)-.5)*.06;   // puffs on the rim, streaked tips
    float e=v-.52;
    float inside=smoothstep(0.,.006,e)*smoothstep(.02,.1,d.y)*smoothstep(.01,.1,1.-mu);
    float jag=.4+1.2*noise(vec3(w*11.,3.));
    float ink=max(1.-smoothstep(0.,.02*jag,e),(1.-smoothstep(0.,.035*jag,vc.x))*smoothstep(.64,.76,noise(vec3(w*3.,11.))));
    vec3 tc=vec3(.044,.028,.089);                           // dark violet
    float lit=step(up+.015,big);
    tc=mix(tc,vec3(.08,.061,.121),lit);                     // lit crowns
    tc=mix(tc,vec3(.113,.076,.137),lit*step(.6,noise(vec3(w*2.,4.))));
    tc=mix(tc,vec3(.013,.007,.03),ink*.95);
    float low=smoothstep(.22,.05,d.y);                      // near the horizon they pale and thin into the glow
    return vec4(mix(tc,vec3(.207,.132,.151),low*.8),inside*(1.-.3*low));
  }
  return vec4(c,cov);
}

/* ---------- ocean ---------- */
float waves(vec2 p,int n){
  float ph=0.,f=.55,tm=1.5,w=1.,sv=0.,sw=0.;
  p*=uHS;
  for(int i=uZ;i<n;i++){
    vec2 d=vec2(sin(ph),cos(ph));
    float x=dot(d,p)*f+uTime*tm;
    float wv=exp(sin(x)-1.);
    p+=d*(-wv*cos(x))*w*.38;
    sv+=wv*w;sw+=w;
    w*=.8;f*=1.18;tm*=1.07;ph+=1232.399963;
  }
  return sv/sw;
}
float cloudDen(vec3 q){                                     // how thick the cloud is at a point in the layer
  float tt=uTime*.02;
  float n=noise(vec3(q.xz*.02,tt))*.6+noise(vec3(q.xz*.05+5.,tt*1.6))*.3;      // where the heaps stand
  float top=-uDepth+uDepth*smoothstep(.38,.62,n)*1.05;
  float er=noise(q*.16+vec3(0.,tt*3.,0.))*.6+noise(q*.4)*.3;                    // billows eaten into the edges
  return clamp((top-q.y)*.25-er*1.6+.35,0.,1.);
}
float mountH(vec2 p){                                       // our peak in the middle, a plain around it, ranges on the skyline
  float r=length(p);
  float ridge=1.-abs(2.*noise(vec3(p*.004,3.))-1.);
  float h=max(exp(-r*.004)*(1.+.25*ridge*(1.-exp(-r*.02)))-.05,0.)/.95;   // a sharp summit: it falls away right from our feet
  h=max(h,smoothstep(5000.,9000.,r)*ridge*.4*smoothstep(-.1,.7,p.y/max(r,1.)));   // far ranges, only behind us
  return clamp(h+(noise(vec3(p*.03,2.))-.5)*.012*step(.01,h),0.,1.);
}
/* ---------- the city on the plain: real blocks of buildings, walked cell by cell along the ray ---------- */
float cityDens(vec2 x){                                     // how built-up a place is
  float d=smoothstep(.4,.58,noise(vec3(x*.0016,9.))*.65+noise(vec3(x*.005,4.))*.35);
  d*=1.-smoothstep(25000.,40000.,length(x));
  return d*smoothstep(0.,.06,abs(noise(vec3(x*.0009,4.))-.5));   // a river cuts through
}
vec3 city(vec3 ro,vec3 rd,float base){
  const float cs=38.;                                       // one block
  vec3 g0=ro+rd*((base-ro.y)/rd.y);
  float far_=smoothstep(3500.,5500.,length(g0.xz-ro.xz));
  vec3 hf=hash33(vec3(floor(g0.xz/24.),1.));
  vec3 lod=cityDens(g0.xz)*mix(vec3(1.,.68,.36),vec3(.8,.88,1.),step(.7,hf.y))*(.1+2.2*pow(hf.x,8.));
  if(far_>.999)return lod;
  vec3 q=ro+rd*max((base+170.-ro.y)/rd.y,0.);               // start where the ray drops below the tallest roofs
  vec2 cell=floor(q.xz/cs),stp=sign(rd.xz),inv=1./max(abs(rd.xz),vec2(1e-5));
  vec2 tMax=((cell+.5+.5*stp)*cs-q.xz)*stp*inv;
  float tc=0.;vec3 res=vec3(0.);bool hit=false;
  for(int i=uZ;i<60;i++){
    vec3 hh=hash33(vec3(cell,5.));
    vec2 ctr=(cell+.5)*cs,dd=ctr-vec2(150.,-1500.);         // downtown lies toward the hole
    float dn=cityDens(ctr);
    float bh=dn*(7.+20.*hh.x+exp(-dot(dd,dd)/270000.)*(35.+150.*hh.y*hh.y));   // low houses, towers downtown
    if(dn>.05&&hh.z>.1){
      vec3 c0=vec3(ctr.x,base+.5*bh,ctr.y),hs=vec3(cs*(.3+.08*hh.x),.5*bh,cs*(.3+.08*hh.y));
      vec3 t0=(c0-hs-q)/rd,t1=(c0+hs-q)/rd,tn=min(t0,t1),tf=max(t0,t1);
      float a=max(max(tn.x,tn.y),tn.z),b=min(min(tf.x,tf.y),tf.z);
      if(a<b&&b>0.){
        vec3 hp=q+rd*max(a,0.);
        vec3 wc=mix(vec3(1.,.72,.4),vec3(.75,.88,1.),step(.6,hh.z));   // warm or cool lighting, per building
        if(tn.y>max(tn.x,tn.z)){                            // roof, with a red beacon on the tall ones
          vec2 rc=hp.xz-ctr;
          res=vec3(.012,.013,.016)+wc*.02+vec3(3.,.1,.05)*step(90.,bh)*exp(-dot(rc,rc)*.6)*(.5+.5*sin(uDiskT*.4+hh.x*20.));
        }else{
        vec2 wg=vec2((tn.x>tn.z?hp.z:hp.x)/3.4,(hp.y-base)/3.8);   // rows of windows, some lit
        vec3 wh=hash33(vec3(floor(wg),hh.x*50.));
        vec2 wf=abs(fract(wg)-.5);
        res=vec3(.01,.011,.014)+wc*step(.78-.25*dn,wh.x)*step(wf.x,.3)*step(wf.y,.26)*(.8+1.6*wh.y);
        }
        hit=true;
      }
    }
    if(hit)break;
    if(tMax.x<tMax.y){tc=tMax.x;tMax.x+=cs*inv.x;cell.x+=stp.x;}
    else{tc=tMax.y;tMax.y+=cs*inv.y;cell.y+=stp.y;}
    if(q.y+rd.y*tc<base)break;
  }
  if(hit)return mix(res,lod,far_);
  vec3 g=q+rd*((base-q.y)/rd.y);                            // nothing in the way: the street itself
  float dn=cityDens(g.xz);
  vec2 f=abs(fract(g.xz/cs)-.5),lp=abs(fract(g.xz/12.)-.5),ci=floor(g.xz/cs);
  float street=smoothstep(.4,.44,max(f.x,f.y));
  float way=mod(ci.y,2.);
  float car=step(.42,f.y)*pow(.5+.5*sin(g.x*.15+uDiskT*.3*(way<.5?1.:-1.)+ci.y*7.),12.);   // head and tail lights
  vec3 gr=vec3(.008,.009,.011)+dn*(vec3(1.,.55,.2)*(street*.06+street*exp(-dot(lp,lp)*40.)*1.6)
    +mix(vec3(1.,.95,.85),vec3(1.,.1,.05),step(.5,way))*car*.9+vec3(1.,.6,.3)*.006);
  return mix(gr,lod,far_);
}
float surfH(vec2 p,int n){
  if(uStage>6.5&&uStage<7.5)return mountH(p);
  return waves(p,n);
}
vec3 waveNormal(vec2 p,float e){
  float hv[3];
  for(int k=uZ;k<3;k++){
    vec2 o=k==0?vec2(0.):(k==1?vec2(e,0.):vec2(0.,e));
    hv[k]=surfH(p+o,36)*uDepth;
  }
  return normalize(vec3(-(hv[1]-hv[0])/e,1.,-(hv[2]-hv[0])/e));
}

/* ---------- broken columns driven into the sea at angles, out in the distance ---------- */
const vec4 CB[10]=vec4[10](                                 // base x, base z, length, radius
  vec4(-57.06,-18.54,38.41,2.16),vec4(-66.54,6.99,37.46,1.90),vec4(-45.92,26.51,25.57,1.56),vec4(-35.35,48.65,20.18,1.40),vec4(-13.90,65.38,29.17,1.55),
  vec4(11.01,51.81,39.38,1.89),vec4(35.43,48.76,35.85,2.16),vec4(57.82,33.38,23.75,2.16),vec4(52.61,5.53,20.81,1.89),vec4(57.45,-18.67,31.33,1.55));
const vec3 CA[10]=vec3[10](                                 // the way each one points
  vec3(0.36,0.93,0.12),vec3(0.55,0.81,-0.20),vec3(0.32,0.95,-0.01),vec3(-0.01,0.99,-0.16),vec3(0.42,0.88,-0.23),
  vec3(-0.51,0.84,-0.20),vec3(0.08,0.98,-0.19),vec3(-0.20,0.97,0.11),vec3(-0.26,0.83,-0.49),vec3(-0.18,0.89,0.43));
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float ruins(vec3 p){
  float d=1e5;
  for(int i=uZ;i<10;i++){
    vec4 c=CB[i];vec3 a=normalize(CA[i]);float fi=float(i),R=c.w;
    vec3 v=p-vec3(c.x,-4.,c.y);
    float h=dot(v,a);
    vec3 rv=v-a*h;
    float rr=length(rv),dc=rr-R*2.3;
    if(dc<1.5){
      vec3 u=normalize(cross(a,vec3(0.,0.,1.))),w=cross(a,u);
      float lx=dot(rv,u),lz=dot(rv,w);
      dc=rr-R*(1.-.004*h)+.04*R*cos(atan(lz,lx)*20.);       // taper and flutes
      dc+=.035*R*smoothstep(.46,.5,abs(fract(h/(2.1*R)+fi*.37)-.5));   // drum joints
      dc+=(noise(p*1.3+fi*7.)-.5)*.11*R;                    // erosion
      float top=c.z;
      bool cap=(i==2||i==7);
      if(!cap)top+=(lx*sin(fi*5.1)+lz*cos(fi*3.3))*.8+(noise(p*.6+fi*9.)-.5)*1.6*R;   // snapped off
      dc=max(dc,h-top);
      if(cap){                                              // surviving capital
        dc=min(dc,sdBox(vec3(lx,h-c.z-.4*R,lz),vec3(1.5*R,.38*R,1.5*R))-.04);
        dc=min(dc,max(rr-(R*.87+(h-(c.z-.8*R))*.55),abs(h-(c.z-.4*R))-.4*R));
      }
    }
    d=min(d,dc);
  }
  return d;
}
float marchR(vec3 ro,vec3 rd,float tmax){
  vec3 inv=1./rd,t0=(vec3(-73.36,-16.00,-26.33)-ro)*inv,t1=(vec3(65.60,41.26,70.95)-ro)*inv;
  vec3 tn=min(t0,t1),tf=max(t0,t1);
  float ta=max(max(tn.x,tn.y),max(tn.z,0.)),tb=min(min(tf.x,tf.y),min(tf.z,tmax));
  if(!(ta<tb))return -1.;
  float t=ta;
  for(int i=uZ;i<80;i++){
    float d=ruins(ro+rd*t);
    if(d<.004+.0012*t)return t;
    t+=d*.85;
    if(t>tb)break;
  }
  return -1.;
}
vec3 shadeR(vec3 p,vec3 rd){
  vec3 n=vec3(0.);
  for(int k=uZ;k<4;k++){                                     // tetrahedral gradient, one copy of the field
    vec3 e=.5773*(2.*vec3(float(((k+3)>>1)&1),float((k>>1)&1),float(k&1))-1.);
    n+=e*ruins(p+.03*e);
  }
  n=normalize(n);
  vec3 alb=vec3(.46,.43,.38)*(.55+.8*fbm(p*1.4))*(.85+.3*noise(vec3(p.xz*4.,p.y*.35)));
  float wet=smoothstep(1.4,-.1,p.y);
  alb*=mix(1.,.5,wet);
  alb=mix(alb,vec3(.1,.17,.09),smoothstep(1.,-.2,p.y)*smoothstep(.4,.6,noise(p*3.))*.6);   // algae at the waterline
  float ndl=max((dot(n,B)+.3)/1.3,0.);
  vec3 c=alb*(vec3(1.,.72,.45)*1.1*ndl+vec3(.035,.05,.075)*(.6+.4*n.y)+vec3(.05,.035,.02)*max(-n.y,0.)+uAmb*1.5);
  c+=vec3(1.,.7,.4)*pow(max(dot(reflect(rd,n),B),0.),20.)*wet*.5;
  return c;
}
vec3 bedColor(vec3 p){                                      // sand and rock seen through the water
  if(uStage>.5&&uStage<1.5){                                // salt crust under a film of water
    float rg=smoothstep(.05,0.,abs(fbm(vec3(p.xz*.45,3.))-.47));
    return (vec3(.5,.5,.52)*(.8+.3*noise(vec3(p.xz*3.,1.)))-.2*rg)*(vec3(.1,.11,.13)+uAmb*2.5+vec3(1.,.72,.45)*.12);
  }
  float m=fbm(vec3(p.xz*.35,1.));
  vec3 alb=mix(vec3(.3,.28,.23),vec3(.16,.17,.16),smoothstep(.4,.6,m))*(.75+.5*noise(vec3(p.xz*2.2,4.)));
  alb*=.85+.15*sin(p.x*5.+3.*noise(vec3(p.xz*.8,2.)));     // sand ripples
  float ca=pow(1.-abs(2.*noise(vec3(p.xz*1.6,uTime*.4))-1.),4.)*.7;                // caustics
  return alb*(vec3(.04,.07,.09)+vec3(1.,.7,.45)*.35*ca);
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.-uRes)/min(uRes.y,uRes.x*1.35);
  vec3 rd=normalize(uFw+(uv.x*uRt+uv.y*uUp)*uTanFov);
  vec3 sd=rd,add=vec3(0.);float mul=1.;
  vec3 hd=normalize(vec3(rd.x,0.,rd.z));
  vec3 fogc=atmo(hd)*1.15;
  /* one loop traces up to three rays against the ruins: the view ray, its reflection, its refraction */
  vec3 ro_=uRo,rd_=rd,p=uRo,T=rd,body=vec3(0.),refl=vec3(0.);
  float tmax_=uStage>6.5?-1.:260.,t=0.,fres=0.,f=0.,tB=0.;
  bool water=false;
  for(int pass=uZ;pass<3;pass++){
    float tH=uStage>6.5?-1.:marchR(ro_,rd_,tmax_);         // no columns on the summit or in open space
    vec3 cH=vec3(0.);
    if(tH>0.)cH=shadeR(ro_+rd_*tH,rd_);
    if(pass==0){
      bool front=tH>0.;
      if(rd.y<0.&&uStage<7.5){
        t=-uRo.y/rd.y;
        if(front&&tH<t){}
        else if(t>40000.){mul=0.;add=fogc;break;}
        else if(uStage>3.5&&uStage<4.5){                    // sea of cloud: march through the layer itself
          vec3 acc=vec3(0.);float tr_=1.,tt=t;
          for(int i=uZ;i<60;i++){
            vec3 q=uRo+rd*tt;
            if(q.y<-uDepth||tr_<.03)break;
            float st=max(1.,tt*.03),dn=cloudDen(q);
            if(dn>.01){
              float sh=exp(-cloudDen(q+B*5.)*1.6);          // is the light reaching this puff
              float a=1.-exp(-dn*st*.22);
              acc+=tr_*a*mix(vec3(.09,.12,.2)+uAmb,vec3(1.,.82,.62)*1.15,sh)*(.55+.45*clamp((q.y+uDepth)/uDepth,0.,1.));
              tr_*=1.-a;
            }
            tt+=st;
          }
          add=mix(acc+tr_*(vec3(.015,.03,.07)+uAmb*.3),fogc+vec3(.2,.2,.24)+uAmb,smoothstep(400.,2500.,t));
          mul=0.;break;
        }
        else{
          p=uRo+rd*t;
          for(int i=uZ;i<96;i++){
            float h=surfH(p.xz,14)*uDepth-uDepth;
            float dy=p.y-h;
            if(dy<.01+t*.0008)break;
            float st=dy*(uStage>6.5?(t>1500.?.7/max(-rd.y,.02):.6):mix(1.,3.,smoothstep(40.,400.,t)));
            p+=rd*st;t+=st;
          }
          if(!(front&&tH<t)){front=false;water=true;}
        }
      }
      if(front){add=mix(cH,fogc,1.-exp(-tH*(.003+uFog*.02)));mul=0.;break;}
      if(!water)break;
      vec3 N=waveNormal(p.xz,uStage>6.5?max(.5,t*.004):max(.012,t*.0015));
      N=normalize(mix(N,vec3(0.,1.,0.),(uStage>2.5?.25:.82)*min(1.,sqrt(t*.0013))));
      fres=.045+.955*pow(1.-max(dot(N,-rd),0.),4.);
      sd=reflect(rd,N);sd.y=abs(sd.y);
      float hN=clamp((p.y+uDepth)/max(uDepth,1e-3),0.,1.);
      float toward=max(dot(hd,normalize(vec3(B.x,0.,B.z))),0.);
      f=1.-exp(-t*(.00015+uFog*.012)*(uStage>6.5?.3:1.));
      vec2 vc=vec2(1.,0.);
      if((uStage>1.5&&uStage<2.5)||(uStage>4.5&&uStage<5.5))vc=voro(p.xz*(uStage>4.5?.22:.11)).xy;
      if(uStage>2.5){                                       // matte ground lit by the disk
        float ndl;vec3 alb,em=vec3(0.);
        if(uStage<3.5){                                     // dunes
          ndl=max(dot(N,B)*2.4-.08,0.);
          alb=vec3(.62,.44,.26)*(.82+.36*fbm(vec3(p.xz*.4,1.)));
        }else if(uStage<4.5){                               // cloud tops, with dark air in the gaps between them
          ndl=max(dot(N,B)*.9+.5,0.);
          alb=mix(vec3(.03,.05,.11),vec3(.86,.88,.94)*(.45+.55*hN),smoothstep(.02,.2,hN));
          em=alb*vec3(.08,.1,.15);                           // soft blue fill so the shaded sides stay cloud, not rock
        }else if(uStage<5.5){                               // cooling lava: black crust, glowing seams
          ndl=max(dot(N,B)*1.6+.05,0.);
          alb=vec3(.035,.03,.03)*(.6+.8*noise(vec3(p.xz*1.5,2.)));
          em=vec3(2.6,.55,.06)*smoothstep(.09,0.,vc.x)*(.6+.4*sin(uDiskT*.05+vc.y*30.))+vec3(.5,.08,0.)*smoothstep(.3,0.,vc.x)*.25;
        }else if(uStage<6.5){                               // grassland, wind running over it
          ndl=max(dot(N,B)*1.8+.1,0.);
          float wind=noise(vec3(p.xz*.08+vec2(uDiskT*.03,0.),uDiskT*.01));
          alb=mix(vec3(.05,.13,.03),vec3(.2,.3,.07),wind)*(.7+.6*noise(vec3(p.xz*2.5,1.)));
        }else{                                              // summit: rock and snow up here, a lit city on the plain below
          ndl=max(dot(N,B)*1.5+.1,0.);
          if(hN>.012){
            float snow=smoothstep(.45,.7,hN+.25*N.y-.2+.15*noise(vec3(p.xz*.02,5.)));
            alb=mix(vec3(.1,.095,.09)*(.6+.8*noise(vec3(p.xz*.08,2.))),vec3(.4,.43,.48),snow);
          }else{
            ndl=0.;alb=vec3(0.);
            em=city(uRo,rd,-uDepth);
          }
        }
        add=(alb*(vec3(1.,.74,.48)*1.3*ndl+vec3(.03,.04,.06)+uAmb*2.)+em)*(1.-f)+fogc*f;
        mul=0.;water=false;break;
      }
      body=vec3(.003,.010,.017)*(.5+.9*hN)+DISKC*.014*hN*hN*toward*toward+uAmb*.2+uToon*vec3(.16,.06,.1);
      fres*=1.-.3*uToon;                                    // painted sea: more of its own plum colour, less mirror
      if(uStage>1.5){                                       // ice sheet: dark glassy ice, drifts of snow, a few thin fractures
        float snow=smoothstep(.45,.7,fbm(vec3(p.xz*.12,5.)));
        body=mix(vec3(.03,.09,.13)*(.8+.5*vc.y),vec3(.42,.47,.52),snow*.85)+vec3(.12,.2,.25)*smoothstep(.022,0.,vc.x)*(1.-snow)+uAmb*.4;
        fres=mix(.08+.7*pow(1.-max(dot(N,-rd),0.),3.),.03,snow*.9);
      }
      T=refract(rd,N,.75);
      tB=(-uDepth-uBed-p.y)/min(T.y,-.05);
      ro_=p+vec3(0.,.05,0.);rd_=sd;tmax_=t<500.?240.:-1.;
    }else if(uStage>2.5){                                   // matte ground never reflects or refracts
    }else if(pass==1){
      if(tH>0.){refl=cH;mul=0.;}
      else mul=fres*(1.-f);
      if(t>=70.||uStage>1.5)break;
      ro_=p;rd_=T;tmax_=tB;                                 // clear water: look down to the ruins and the floor
    }else{
      float dU=tB;vec3 under;
      if(tH>0.){dU=tH;under=cH;}
      else under=bedColor(p+T*tB);
      vec3 tm=exp(-dU*uAbs*vec3(.40,.15,.11));
      vec3 glowL=vec3(0.);
      if(uLife>.5&&uStage<.5){
        vec2 bq=(p+T*dU).xz-vec2(sin(uDiskT*.006)*70.,-20.+8.*sin(uDiskT*.0023));   // something huge passing below
        bq.y+=sin(bq.x*.25+uDiskT*.04)*1.2;
        under*=1.-.9*smoothstep(1.,.55,length(bq/vec2(15.,3.2)));
        for(int j=uZ;j<6;j++){                               // drifting jellyfish
          float fj=float(j);
          vec3 c=vec3(sin(fj*2.4+uDiskT*.004)*9.+fj*1.5-4.,-1.1-.5*sin(fj*1.7+uDiskT*.02)-uDepth,-5.-fj*4.5+3.*sin(fj+uDiskT*.003));
          float s0=clamp(dot(c-p,T),0.,dU);
          vec3 dv=p+T*s0-c;dv.y*=dv.y<0.?.45:1.;            // trailing tentacles
          float g=exp(-dot(dv,dv)*5.)*(.6+.4*sin(uDiskT*.25+fj*2.))+.06/(1.+dot(dv,dv)*3.);
          glowL+=mix(vec3(.15,.9,1.),vec3(.9,.35,1.),fract(fj*.37))*g*exp(-s0*uAbs*.12);
        }
      }
      body=mix(body,under*tm+body*(1.-tm)+glowL*1.2,smoothstep(70.,45.,t));
    }
  }
  if(water)add=(body*(1.-fres)+refl*fres)*(1.-f)+fogc*f;
  vec3 col=add;
  float muB=dot(rd,B);
  bool over=rd.y<0.&&uStage<7.5&&muB>0.&&uDist*sqrt(max(1.-muB*muB,0.))<15.;
  for(int k=uZ;k<2;k++){                                     // 0: the sky this pixel shows or reflects, 1: the hole laid over the sea
    vec3 dd=k==0?sd:rd;
    if(k==0?mul>.0005:over){
      vec3 sp=space(dd);
      if(k==0){
        vec3 sk=sp;                                         // open space: nothing but the sky itself
        if(uStage<7.5){
          sk=gEm*uBoost+(sp-gEm)*exp(-.06/(max(dd.y,0.)+.03))*uStar+atmo(dd)*gTr;
          if(uAur>0.)sk+=aurora(dd)*uAur;
          if(uCloud>0.){vec4 cl=clouds(dd);sk=mix(sk,cl.rgb,cl.a);}
        }
        col+=mul*sk;
      }else col=gEm*uBoost+gTr*col;
    }
  }
  if(isnan(col.r)||isnan(col.g)||isnan(col.b))col=vec3(0.);
  col=clamp(col,0.,64.);
  if(uLDR>.5)col=sqrt(min(col,16.)/16.);
  fragColor=vec4(col,1.);
}
</script>

<script id="fs-post" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uT;
uniform vec2 uRes;
uniform float uExp,uSeed,uLDR,uLB;
vec3 S(vec2 uv,float l){vec3 c=textureLod(uT,uv,l).rgb;return uLDR>.5?c*c*16.:c;}
vec3 aces(vec3 x){return clamp(x*(2.51*x+.03)/(x*(2.43*x+.59)+.14),0.,1.);}
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  vec2 ts=1./vec2(textureSize(uT,0));
  vec3 c=S(uv,max(uLB,0.));
  vec3 b=vec3(0.);float w=.4;
  for(int i=0;i<4;i++){                       // glare: wide blur read from the mip chain
    float l=1.5+float(i)*1.5+uLB;
    vec2 d=ts*exp2(l)*.5;
    b+=w*.25*(S(uv+d,l)+S(uv-d,l)+S(uv+vec2(d.x,-d.y),l)+S(uv+vec2(-d.x,d.y),l));
    w*=.75;
  }
  c+=b*.14;
  vec2 q=uv-.5;
  c*=uExp*(1.-dot(q,q)*.6);
  c=pow(aces(c),vec3(1./2.2));
  c+=(hash(gl_FragCoord.xy+uSeed)-.5)*3./255.;
  fragColor=vec4(c,1.);
}
</script>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var canvas=$("view"),failBox=$("fail");
  function fail(msg,detail){
    failBox.hidden=false;
    failBox.innerHTML="";
    var d=document.createElement("div");
    d.textContent=msg;
    if(detail){var p=document.createElement("pre");p.textContent=detail;d.appendChild(p);}
    failBox.appendChild(d);
  }
  var gl=canvas.getContext("webgl2",{antialias:false,alpha:false,powerPreference:"high-performance"});
  if(!gl){fail("この端末では WebGL2 が使えないため、映像を描画できません。別のブラウザか端末で開いてください。");return;}

  var VS="#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}";
  function compile(type,src){
    var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(src){
    var p=gl.createProgram();
    gl.attachShader(p,compile(gl.VERTEX_SHADER,VS));
    gl.attachShader(p,compile(gl.FRAGMENT_SHADER,src));
    gl.linkProgram(p);                                      // the driver builds it in the background
    return {p:p,u:{}};
  }
  function finish(pr){
    var p=pr.p;
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)||"link failed");
    var n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
    for(var i=0;i<n;i++){var a=gl.getActiveUniform(p,i);pr.u[a.name]=gl.getUniformLocation(p,a.name);}
  }
  var SRC=$("fs-scene").textContent,scenes={};
  function buildScene(g){                                   // the stage becomes a constant in the source
    var pr=program(SRC.replace("#version 300 es","#version 300 es\n#define uStage "+g+".").replace("uniform float uStage,uBed,","uniform float uBed,"));
    pr.stage=g;pr.ready=false;
    return pr;
  }
  var scene,post;
  var NSTAGE=9;
  try{for(var gi=0;gi<NSTAGE;gi++)scenes[gi]=buildScene(gi);scene=scenes[0];post=program($("fs-post").textContent);}
  catch(e){fail("シェーダーの準備に失敗しました。",String(e.message||e));return;}

  var hdr=!!gl.getExtension("EXT_color_buffer_float")||!!gl.getExtension("EXT_color_buffer_half_float");
  var tex=gl.createTexture(),fbo=gl.createFramebuffer(),vao=gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var tw=0,th=0;
  function allocTarget(w,h){
    if(w===tw&&h===th)return;
    tw=w;th=h;
    gl.bindTexture(gl.TEXTURE_2D,tex);
    if(hdr)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
    else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    if(hdr&&gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){hdr=false;tw=0;allocTarget(w,h);}
  }

  /* ---- state ---- */
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var S={stage:0,sky:0,life:true,flash:0,wt:20,calm:false,q:2,clear:.5,yaw:0,pitch:.13,fov:62,dist:45,tilt:8,wave:1.2,speed:1,ev:0,paused:reduce,t:20,diskT:0};
  var scale=.6,ceiling=1,dirty=true,touched=false;

  /* ---- controls ---- */
  var fmt={
    dist:function(v){return v+" r_s";},
    tilt:function(v){return v+"°";},
    wave:function(v){return (+v).toFixed(1)+" m";},
    time:function(v){return "×"+(+v).toFixed(1);},
    exp:function(v){return (v>0?"+":"")+(+v).toFixed(1)+" EV";},
    clear:function(v){return Math.round(v*100)+"%";}
  };
  var keyOf={dist:"dist",tilt:"tilt",wave:"wave",time:"speed",exp:"ev",clear:"clear"};
  function readouts(){
    var D=S.dist;
    $("r-au").textContent=D+" r_s = "+(D*1.27e7/1.496e8).toFixed(2)+" au";
    var a=2*Math.asin(Math.min(1,2.598/D*Math.sqrt(1-1/D)))*180/Math.PI;
    $("r-shadow").textContent=a.toFixed(1)+"°";
    $("r-dil").textContent="遠方の "+(1/Math.sqrt(1-1/D)).toFixed(3)+" 秒";
  }
  Object.keys(fmt).forEach(function(k){
    var el=$("s-"+k),out=$("o-"+k);
    function sync(){S[keyOf[k]]=+el.value;out.textContent=fmt[k](el.value);readouts();dirty=true;}
    el.addEventListener("input",sync);sync();
  });
  var pauseBtn=$("pause");
  function setPaused(p){S.paused=p;pauseBtn.setAttribute("aria-pressed",String(p));pauseBtn.textContent=p?"再生":"一時停止";dirty=true;}
  pauseBtn.addEventListener("click",function(){setPaused(!S.paused);});
  setPaused(S.paused);
  var calmBtn=$("calm");
  calmBtn.addEventListener("click",function(){
    S.calm=!S.calm;calmBtn.setAttribute("aria-pressed",String(S.calm));
    calmBtn.textContent=S.calm?"うねりを動かす":"うねりを止める";dirty=true;
  });

  var panel=$("panel"),toggle=$("toggle");
  function setPanel(open){panel.hidden=!open;toggle.setAttribute("aria-expanded",String(open));}
  function setBare(b){document.body.classList.toggle("bare",b);if(!b)setPanel(true);}
  toggle.addEventListener("click",function(){
    if(document.body.classList.contains("bare"))setBare(false);else setPanel(panel.hidden);
  });
  $("bare").addEventListener("click",function(){setBare(true);});
  window.addEventListener("keydown",function(e){
    if((e.key==="h"||e.key==="H")&&!e.ctrlKey&&!e.metaKey)setBare(!document.body.classList.contains("bare"));
  });

  /* ---- stage and sky ---- */
  var SKY=[
    {h:[0,0,0],z:[0,0,0],a:[0,0,0],star:1,cloud:0,fog:0,aur:0},
    {h:[.30,.11,.04],z:[.03,.025,.07],a:[.07,.05,.045],star:.35,cloud:.3,fog:0,aur:0,boost:1.5},
    {h:[0,.004,.003],z:[0,0,0],a:[.008,.028,.018],star:1,cloud:0,fog:0,aur:1},
    {h:[.012,.015,.02],z:[.004,.005,.008],a:[.01,.012,.016],star:.15,cloud:1,fog:.12,aur:0},
    {h:[.04,.045,.055],z:[.01,.012,.016],a:[.03,.033,.04],star:.5,cloud:0,fog:1,aur:0},
    {h:[1.15,.62,.68],z:[.5,.25,.2],a:[.2,.1,.12],star:.5,cloud:.75,fog:.03,aur:0,toon:1,boost:3},
    {h:[.35,.2,.22],z:[.04,.07,.16],a:[.06,.06,.08],star:.4,cloud:.35,fog:.03,aur:0,boost:1.3},      // dawn
    {h:[.45,.6,.8],z:[.1,.25,.6],a:[.25,.3,.38],star:0,cloud:.5,fog:.02,aur:0,boost:3},               // blue day
    {h:[0,0,0],z:[0,0,0],a:[.01,.012,.02],star:3,cloud:0,fog:0,aur:0},                                // a sky full of stars
    {h:[.5,.03,.02],z:[.1,0,.01],a:[.1,.02,.02],star:.6,cloud:.5,fog:.04,aur:0,boost:1.5}];          // crimson   // glowing pastel dusk
  function chips(id,key){
    var bs=$(id).querySelectorAll("button");
    function paint(){bs.forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.v===S[key]));});}
    bs.forEach(function(b){b.addEventListener("click",function(){S[key]=+b.dataset.v;paint();dirty=true;});});
    paint();
  }
  chips("c-stage","stage");chips("c-sky","sky");
  var lifeBtn=$("life");
  lifeBtn.addEventListener("click",function(){
    S.life=!S.life;lifeBtn.setAttribute("aria-pressed",String(!S.life));
    lifeBtn.textContent=S.life?"生き物を消す":"生き物を出す";dirty=true;
  });

  /* ---- photo: grab the frame right after it is drawn ---- */
  var wantShot=false,shotUrl=null;
  $("shot").addEventListener("click",function(){wantShot=true;dirty=true;});
  function showShot(blob){
    if(!blob)return;
    if(shotUrl)URL.revokeObjectURL(shotUrl);
    shotUrl=URL.createObjectURL(blob);
    $("shot-img").src=shotUrl;$("shot-save").href=shotUrl;$("shot-view").hidden=false;
  }
  $("shot-close").addEventListener("click",function(){$("shot-view").hidden=true;});
  setPanel(window.innerWidth>640);

  /* ---- sound: all synthesised, starts on the first interaction ---- */
  var AC=null,master,seaGain,seaFilt,droneGain,noise=null,soundOn=true;
  var musicOn=true,musicGain=null,delayIn=null,nextBar=0,bar=0;
  var CH=[[50,57,62,65,69],[46,53,58,62,65],[41,48,57,60,64],[45,52,57,60,67]];   // Dm, B flat, F, Am
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function pad(m,t,dur,vol){                                // slow swelling chord tone
    var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),lp=AC.createBiquadFilter();
    o.type="triangle";o2.type="sawtooth";o.frequency.value=hz(m);o2.frequency.value=hz(m)*1.004;
    lp.type="lowpass";lp.frequency.value=700;g2.gain.value=.35;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.linearRampToValueAtTime(.0001,t+dur);
    o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(delayIn);
    o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
  }
  function bell(m,t,vol){
    var o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.value=hz(m);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.5);
    o.connect(g);g.connect(delayIn);o.start(t);o.stop(t+3.6);
  }
  function musicTick(){                                     // one chord every 8 s, a few bell notes scattered over it
    if(!AC||!musicGain)return;
    var now=AC.currentTime;
    if(S.paused||nextBar<now-1){if(nextBar<now)nextBar=now+.4;if(S.paused)return;}
    while(nextBar<now+1.2){
      var c=CH[bar%4],L=8,t=nextBar,storm=S.sky===3;
      pad(c[0]-12,t,L+3,.1);pad(c[1],t,L+3,.06);pad(c[2],t,L+3,.06);pad(c[3]-(storm?1:0),t,L+3,.05);
      if(S.dist<28)pad(c[0]-24,t,L+3,.12);                  // closer to the hole: a deeper floor
      var n=(storm?1:2)+Math.floor(Math.random()*3);
      for(var i=0;i<n;i++)bell(c[1+Math.floor(Math.random()*4)]+12+(Math.random()<.3?12:0),t+Math.random()*L,.05+.03*Math.random());
      bar++;nextBar+=L;
    }
  }
  function thunder(delay){
    if(!AC)return;
    var t=AC.currentTime+delay,src=AC.createBufferSource(),lp=AC.createBiquadFilter(),g=AC.createGain();
    src.buffer=noise;lp.type="lowpass";lp.frequency.setValueAtTime(400,t);lp.frequency.exponentialRampToValueAtTime(70,t+2.5);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1.6,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
    src.connect(lp);lp.connect(g);g.connect(master);src.start(t,Math.random()*2);src.stop(t+3.4);
  }
  function initAudio(){
    if(AC){if(AC.state==="suspended")AC.resume();return;}
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    try{
      AC=new C();
      master=AC.createGain();master.gain.value=soundOn?.8:0;master.connect(AC.destination);
      noise=AC.createBuffer(1,AC.sampleRate*6,AC.sampleRate);            // brown noise, shared by sea and effects
      var d=noise.getChannelData(0),l=0;
      for(var i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
      var src=AC.createBufferSource();src.buffer=noise;src.loop=true;
      seaFilt=AC.createBiquadFilter();seaFilt.type="lowpass";seaFilt.frequency.value=600;
      seaGain=AC.createGain();seaGain.gain.value=0;
      src.connect(seaFilt);seaFilt.connect(seaGain);seaGain.connect(master);src.start();
      var lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=230;           // the hole: a low drone
      droneGain=AC.createGain();droneGain.gain.value=0;
      lp.connect(droneGain);droneGain.connect(master);
      [[41,"sawtooth",.2],[41.5,"sawtooth",.2],[61.7,"sine",.14],[123.4,"sine",.05]].forEach(function(v){
        var o=AC.createOscillator(),g=AC.createGain();
        o.type=v[1];o.frequency.value=v[0];g.gain.value=v[2];
        o.connect(g);g.connect(lp);o.start();
      });
      musicGain=AC.createGain();musicGain.gain.value=musicOn?.5:0;musicGain.connect(master);
      var dl=AC.createDelay(1.5),fb=AC.createGain(),dlp=AC.createBiquadFilter();           // echo that stands in for a hall
      dl.delayTime.value=.42;fb.gain.value=.45;dlp.type="lowpass";dlp.frequency.value=1800;
      delayIn=AC.createGain();delayIn.connect(musicGain);delayIn.connect(dl);
      dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(musicGain);
      nextBar=AC.currentTime+.6;
    }catch(e){AC=null;}
  }
  function audioTick(){
    if(!AC)return;
    var now=AC.currentTime,still=S.paused||S.speed<=0;
    var lfo=.6+.3*Math.sin(S.wt*.55)+.15*Math.sin(S.wt*1.31);
    var sea=Math.min(1,.06+S.wave*.45)*.55*((still||S.calm)?.25:lfo)*(S.stage===0?(S.sky===3?1.6:1):S.stage===8?0:.3);
    musicTick();
    seaGain.gain.setTargetAtTime(sea,now,.4);
    seaFilt.frequency.setTargetAtTime(350+700*lfo*Math.min(1,.3+S.wave*.5),now,.4);
    droneGain.gain.setTargetAtTime(Math.min(1.5,Math.max(.3,30/S.dist))*(still?.12:.3),now,.6);
  }
  function whoosh(){                                        // a throw
    if(!AC)return;
    var now=AC.currentTime,src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
    src.buffer=noise;bp.type="bandpass";bp.Q.value=1.1;
    bp.frequency.setValueAtTime(260,now);bp.frequency.exponentialRampToValueAtTime(1700,now+.35);
    bp.frequency.exponentialRampToValueAtTime(420,now+.9);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.7,now+.12);g.gain.exponentialRampToValueAtTime(.0001,now+.9);
    src.connect(bp);bp.connect(g);g.connect(master);
    src.start(now,Math.random()*4);src.stop(now+1);
  }
  function gulp(){                                          // swallowed: a tone sliding down out of hearing
    if(!AC)return;
    var now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.setValueAtTime(260,now);o.frequency.exponentialRampToValueAtTime(24,now+1.8);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.5,now+.08);g.gain.exponentialRampToValueAtTime(.0001,now+1.9);
    o.connect(g);g.connect(master);o.start(now);o.stop(now+2);
    var src=AC.createBufferSource(),lp=AC.createBiquadFilter(),g2=AC.createGain();
    src.buffer=noise;lp.type="lowpass";lp.frequency.value=160;
    g2.gain.setValueAtTime(.9,now);g2.gain.exponentialRampToValueAtTime(.0001,now+1.2);
    src.connect(lp);lp.connect(g2);g2.connect(master);
    src.start(now,Math.random()*4);src.stop(now+1.3);
  }
  window.addEventListener("pointerdown",initAudio,true);
  window.addEventListener("keydown",initAudio,true);
  var musicBtn=$("music");
  musicBtn.addEventListener("click",function(){
    musicOn=!musicOn;musicBtn.setAttribute("aria-pressed",String(!musicOn));
    musicBtn.textContent=musicOn?"音楽を止める":"音楽を流す";
    if(musicGain)musicGain.gain.setTargetAtTime(musicOn?.5:0,AC.currentTime,.3);
  });
  var muteBtn=$("mute");
  muteBtn.addEventListener("click",function(){
    soundOn=!soundOn;muteBtn.setAttribute("aria-pressed",String(!soundOn));
    muteBtn.textContent=soundOn?"音を消す":"音を鳴らす";
    if(AC)master.gain.setTargetAtTime(soundOn?.8:0,AC.currentTime,.05);
  });

  function interacted(){if(!touched){touched=true;$("hint").classList.add("gone");}dirty=true;}

  /* ---- pointer look / zoom ---- */
  var ptrs=new Map(),pinch=0,tap=null;

  /* ---- thrown objects (positions in the hole's frame, units of r_s, c = 1) ---- */
  var BH=[0,.15643,-.98769],objs=[],camNow=null;
  var holeD=-1,holeEl=0;
  function placeHole(){
    /* Height depends on distance only. Trace the disk's rim as seen from here, for every tilt the
       slider allows, and lift the hole until the lowest point of it clears the horizon. */
    if(S.dist===holeD)return;
    var D=S.dist,down=0,rl=.3;
    for(var t=2;t<=10;t+=2){
      var inc=t*Math.PI/180;
      var n=[Math.cos(inc)*Math.sin(rl),Math.cos(inc)*Math.cos(rl),Math.sin(inc)];   // (right, up, toward viewer)
      var e1=norm(cross(n,[0,0,1])),e2=cross(n,e1);
      for(var k=0;k<48;k++){
        var ph=k/48*Math.PI*2,c=Math.cos(ph)*11.3,q=Math.sin(ph)*11.3;
        var up=c*e1[1]+q*e2[1],tow=c*e1[2]+q*e2[2];
        down=Math.max(down,Math.atan(-up/Math.max(D-tow,2)));
      }
    }
    var el=Math.min(Math.max(down,Math.atan(5.8/D))+.01,1.2);
    if(holeD>0)S.pitch=Math.max(-.5,Math.min(1.1,S.pitch+el-holeEl));   // keep it framed as it rises
    holeD=D;holeEl=el;
    BH[1]=Math.sin(el);BH[2]=-Math.cos(el);
  }
  var thrown=0;
  function throwDir(dir){
    var D=S.dist,o=[-BH[0]*D+dir[0]*3.5,-BH[1]*D+dir[1]*3.5,-BH[2]*D+dir[2]*3.5];
    var j=function(){return (Math.random()-.5)*.05;};
    var v=norm([dir[0]+j(),dir[1]+j(),dir[2]+j()]);
    if(objs.length>=8)objs.shift();
    var type=[0,1,4,5,2,3][thrown++%6];                   // earth, saturn, sun, moon, jupiter, mars, in turn
    objs.push({p:o,v:[v[0]*.28,v[1]*.28,v[2]*.28],type:type,R:[.6,.75,.95,.45,1.15,.36][type],
      ax:norm([Math.random()-.5,1,Math.random()-.5]),seed:Math.random()*50,age:Math.random()*100});
    whoosh();
    dirty=true;
  }
  function throwAt(cx,cy){
    if(!camNow)return;
    var r=canvas.getBoundingClientRect(),w=r.width,h=r.height;
    var m=Math.min(h,w*1.35);
    var ux=((cx-r.left)*2-w)/m,uy=(h-(cy-r.top)*2)/m,c=camNow;
    throwDir(norm([c.fw[0]+(ux*c.rt[0]+uy*c.up[0])*c.tan,c.fw[1]+(ux*c.rt[1]+uy*c.up[1])*c.tan,c.fw[2]+(ux*c.rt[2]+uy*c.up[2])*c.tan]));
  }
  $("throw").addEventListener("click",function(){throwDir(BH);interacted();});
  function stepObjs(T){
    for(var i=objs.length-1;i>=0;i--){
      var o=objs[i],p=o.p,v=o.v,rem=T,n=0,dead=false;
      o.age+=T;
      while(rem>1e-5&&n++<80){
        var r=Math.hypot(p[0],p[1],p[2]);
        if(r<1.03){dead=true;break;}
        var h=Math.min(rem,Math.max(.004,.03*(r-1)));rem-=h;
        var a=-.5/(r*(r-1)*(r-1));                       // Paczynski-Wiita gravity
        v[0]+=p[0]*a*h;v[1]+=p[1]*a*h;v[2]+=p[2]*a*h;
        var vr=(v[0]*p[0]+v[1]*p[1]+v[2]*p[2])/r;
        var k=.012*h,far=(r>S.dist*1.5&&vr>0)?.05*h:0;           // drag: sheds angular momentum so orbits decay
        for(var q=0;q<3;q++){var rad=p[q]/r*vr;v[q]-=(v[q]-rad)*k+v[q]*far;p[q]+=v[q]*h;}
      }
      if(dead)gulp();
      if(dead||(o.life=(o.life||0)+T)>1500)objs.splice(i,1);
    }
  }

  canvas.addEventListener("pointerdown",function(e){
    canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0;
    tap=ptrs.size===1?{id:e.pointerId,t:performance.now(),m:0}:null;
  });
  canvas.addEventListener("pointermove",function(e){
    var p=ptrs.get(e.pointerId);if(!p)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(tap){tap.m+=Math.abs(dx)+Math.abs(dy);if(tap.m<8)return;}
    if(ptrs.size===1){
      var k=S.fov/62*.0028;
      S.yaw+=dx*k;S.pitch=Math.max(-.5,Math.min(1.1,S.pitch-dy*k));
    }else if(ptrs.size===2){
      var a=Array.from(ptrs.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch)S.fov=Math.max(18,Math.min(95,S.fov*pinch/d));
      pinch=d;
    }
    interacted();
  });
  function drop(e){ptrs.delete(e.pointerId);pinch=0;}
  canvas.addEventListener("pointerup",function(e){
    if(tap&&tap.id===e.pointerId&&tap.m<8&&performance.now()-tap.t<500){throwAt(e.clientX,e.clientY);interacted();}
    tap=null;drop(e);
  });
  canvas.addEventListener("pointercancel",function(e){tap=null;drop(e);});
  canvas.addEventListener("wheel",function(e){
    e.preventDefault();S.fov=Math.max(18,Math.min(95,S.fov*Math.exp(e.deltaY*.0012)));interacted();
  },{passive:false});
  canvas.addEventListener("keydown",function(e){
    var k=.05;
    if(e.key==="ArrowLeft")S.yaw-=k;else if(e.key==="ArrowRight")S.yaw+=k;
    else if(e.key==="ArrowUp")S.pitch=Math.min(1.1,S.pitch+k);
    else if(e.key==="ArrowDown")S.pitch=Math.max(-.5,S.pitch-k);
    else if(e.key==="+"||e.key==="=")S.fov=Math.max(18,S.fov*.92);
    else if(e.key==="-")S.fov=Math.min(95,S.fov/.92);
    else return;
    e.preventDefault();interacted();
  });
  window.addEventListener("resize",function(){dirty=true;});

  /* ---- vector helpers ---- */
  function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
  function norm(a){var l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}

  /* ---- frame loop with adaptive render resolution ---- */
  var last=0,acc=0,frames=0,hold=0;
  function frame(now){
    requestAnimationFrame(frame);
    var dt=last?(now-last)/1000:0;last=now;
    if(dt>.1)dt=0;
    if(!S.paused&&S.speed>0){S.t+=dt*S.speed;if(!S.calm)S.wt+=dt*S.speed;S.diskT+=dt*S.speed*5;if(objs.length)stepObjs(dt*S.speed*14);dirty=true;}
    if(S.sky===3&&!S.paused&&dt>0&&Math.random()<dt*.16){S.flash=1;thunder(.5+Math.random()*2);}
    if(S.flash>.001){S.flash*=Math.exp(-dt*5)*(Math.random()<.2?.4:1);dirty=true;}else S.flash=0;
    var want=scenes[S.stage];                               // switching stage: build its shader in the background, keep showing the old one
    if(!want){
      try{want=scenes[S.stage]=buildScene(S.stage);}catch(e){fail("シェーダーの準備に失敗しました。",String(e.message||e));return;}
      loading.hidden=false;
    }
    if(!want.ready&&(!par||gl.getProgramParameter(want.p,par.COMPLETION_STATUS_KHR))){
      try{finish(want);}catch(e){fail("シェーダーの準備に失敗しました。",String(e.message||e));return;}
      want.ready=true;loading.hidden=true;dirty=true;
    }
    if(want.ready)scene=want;
    audioTick();
    if(!dirty)return;
    dirty=false;

    scale=S.q;

    var dpr=Math.min(window.devicePixelRatio||1,2);
    var cw=Math.max(2,Math.round(canvas.clientWidth*dpr)),ch=Math.max(2,Math.round(canvas.clientHeight*dpr));
    if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
    scale=Math.min(scale,Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),8192)/Math.max(cw,ch));
    var rw=Math.max(2,Math.round(cw*scale)),rh=Math.max(2,Math.round(ch*scale));
    allocTarget(rw,rh);

    /* camera: standing on a small boat, so it rides the swell a little */
    var drift=touched?0:Math.sin(S.t*.05)*.07;
    var yaw=S.yaw+drift,pitch=S.pitch;
    var fw=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
    var rt=norm(cross(fw,[0,1,0])),up=cross(rt,fw);
    var afloat=S.stage===0?1:0,storm=S.sky===3;
    var roll=.012*Math.sin(S.wt*.47)*S.wave*afloat;
    var cr=Math.cos(roll),sr=Math.sin(roll);
    var rt2=[rt[0]*cr+up[0]*sr,rt[1]*cr+up[1]*sr,rt[2]*cr+up[2]*sr];
    var up2=[up[0]*cr-rt[0]*sr,up[1]*cr-rt[1]*sr,up[2]*cr-rt[2]*sr];
    var ro=[0,2.3+.22*S.wave*Math.sin(S.wt*.62)*afloat+(S.stage===4?6:0),0];

    /* disk orientation */
    placeHole();
    var s=BH[1],c=-BH[2],inc=S.tilt*Math.PI/180,rl=.3;
    var U=[0,c,s],V=[0,-s,c];
    var nd=norm([Math.cos(inc)*Math.sin(rl)+0,Math.cos(inc)*Math.cos(rl)*U[1]+Math.sin(inc)*V[1],Math.cos(inc)*Math.cos(rl)*U[2]+Math.sin(inc)*V[2]]);
    var e1=norm(cross(nd,[0,0,1])),e2=cross(nd,e1);

    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.viewport(0,0,rw,rh);
    gl.useProgram(scene.p);
    var u=scene.u;
    gl.uniform2f(u.uRes,rw,rh);
    gl.uniform3fv(u.uBH,BH);
    var g=scene.stage,sk=SKY[S.sky];
    gl.uniform1f(u.uTime,[S.wt,S.wt,7.3,3.1,S.wt,2.2,4.4,1,0][g]);gl.uniform1f(u.uDiskT,S.diskT);
    gl.uniform1f(u.uStage,g);gl.uniform1f(u.uHS,[1,1,1,.16,1,.35,.12,1,1][g]);gl.uniform1f(u.uBed,g===1?.07:2.2);
    gl.uniform1f(u.uStar,sk.star);gl.uniform1f(u.uCloud,sk.cloud);gl.uniform1f(u.uFog,sk.fog);gl.uniform1f(u.uAur,sk.aur);gl.uniform1f(u.uToon,sk.toon||0);gl.uniform1f(u.uBoost,sk.boost||1);
    gl.uniform1f(u.uFlash,S.flash);gl.uniform1f(u.uLife,S.life?1:0);
    gl.uniform3fv(u.uSkyH,sk.h);gl.uniform3fv(u.uSkyZ,sk.z);gl.uniform3fv(u.uAmb,sk.a);
    gl.uniform1f(u.uAbs,Math.pow(8,1-2*S.clear));gl.uniform1f(u.uDist,S.dist);gl.uniform1f(u.uDepth,[S.wave*(storm?1.8:1),0,.05,7+4*S.wave,26+10*S.wave,1.2+1.5*S.wave,5+4*S.wave,450,0][g]);
    gl.uniform1f(u.uTanFov,Math.tan(S.fov*Math.PI/360));
    gl.uniform1f(u.uLDR,hdr?0:1);
    gl.uniform3fv(u.uRo,ro);gl.uniform3fv(u.uFw,fw);gl.uniform3fv(u.uRt,rt2);gl.uniform3fv(u.uUp,up2);
    gl.uniform3fv(u.uNd,nd);gl.uniform3fv(u.uE1,e1);gl.uniform3fv(u.uE2,e2);
    camNow={fw:fw,rt:rt2,up:up2,tan:Math.tan(S.fov*Math.PI/360)};
    var nO=objs.length,aP=new Float32Array(32),aQ=new Float32Array(32),aA=new Float32Array(32),aK=new Float32Array(32);
    for(var i=0;i<nO;i++){
      var ob=objs[i],op=ob.p,r=Math.hypot(op[0],op[1],op[2]);
      var st=Math.min(8,1+10/(r*r*r));                    // tidal stretching grows toward the hole
      var red=Math.min(1,Math.max(0,(2.6-r)/1.6)),dim=Math.pow(Math.max(0,1-1/r),1.2);
      aP.set([op[0],op[1],op[2],ob.R],i*4);
      aQ.set([op[0]/r,op[1]/r,op[2]/r,st],i*4);
      aA.set([ob.ax[0],ob.ax[1],ob.ax[2],ob.type],i*4);
      aK.set([dim,red,ob.age*.02,ob.seed],i*4);
    }
    gl.uniform1i(u.uN,nO);
    if(u["uP[0]"])gl.uniform4fv(u["uP[0]"],aP);
    if(u["uQ[0]"])gl.uniform4fv(u["uQ[0]"],aQ);
    if(u["uA[0]"])gl.uniform4fv(u["uA[0]"],aA);
    if(u["uK[0]"])gl.uniform4fv(u["uK[0]"],aK);
    gl.drawArrays(gl.TRIANGLES,0,3);

    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,cw,ch);
    gl.useProgram(post.p);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.generateMipmap(gl.TEXTURE_2D);
    gl.uniform1i(post.u.uT,0);
    gl.uniform2f(post.u.uRes,cw,ch);
    gl.uniform1f(post.u.uExp,Math.pow(2,S.ev)*1.15);
    gl.uniform1f(post.u.uSeed,S.paused?0:(now%1000));
    gl.uniform1f(post.u.uLDR,hdr?0:1);
    gl.uniform1f(post.u.uLB,Math.log2(rw/cw));
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(wantShot){wantShot=false;canvas.toBlob(showShot,"image/png");}
  }
  canvas.addEventListener("webglcontextlost",function(e){e.preventDefault();});
  var par=gl.getExtension("KHR_parallel_shader_compile"),loading=$("loading");
  setTimeout(function wait(){                               // start drawing once the shaders are built, without freezing the page
    var done=0;
    for(var i=0;i<NSTAGE;i++)if(!par||gl.getProgramParameter(scenes[i].p,par.COMPLETION_STATUS_KHR))done++;
    loading.textContent="景色を準備しています… "+done+" / "+NSTAGE;
    if(done<NSTAGE||(par&&!gl.getProgramParameter(post.p,par.COMPLETION_STATUS_KHR))){setTimeout(wait,150);return;}
    loading.hidden=true;
    try{for(i=0;i<NSTAGE;i++){finish(scenes[i]);scenes[i].ready=true;}finish(post);}
    catch(e){fail("シェーダーの準備に失敗しました。",String(e.message||e));return;}
    requestAnimationFrame(frame);
  },60);
})();
</script>
</body>
</html>
